<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)"/>

  <!-- Graduation cap -->
  <!-- Cap top (board) -->
  <path d="M 32 16 L 50 22 L 32 28 L 14 22 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Cap tassel -->
  <circle cx="32" cy="16" r="2" fill="#fbbf24"/>
  <line x1="32" y1="18" x2="32" y2="24" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="32" cy="24" r="1.5" fill="#fbbf24"/>

  <!-- Cap side (mortar board side view) -->
  <path d="M 32 28 L 32 34 L 28 36 L 28 30 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Book icon below cap -->
  <rect x="22" y="38" width="20" height="14" rx="1" fill="#ffffff" opacity="0.9"/>
  <line x1="22" y1="42" x2="42" y2="42" stroke="#6366f1" stroke-width="0.5"/>
  <line x1="22" y1="46" x2="42" y2="46" stroke="#6366f1" stroke-width="0.5"/>
  <line x1="32" y1="38" x2="32" y2="52" stroke="#6366f1" stroke-width="1"/>

  <!-- Small decorative stars -->
  <circle cx="50" cy="14" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="14" cy="50" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="54" cy="50" r="1.5" fill="#fbbf24" opacity="0.8"/>
</svg>
